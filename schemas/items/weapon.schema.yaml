$schema: https://json-schema.org/draft/2020-12/schema
$id: https://shadowforgedmmo.com/schemas/items/weapon.schema.yaml
title: Weapon
description: A weapon item
type: object
properties:
  type:
    type: string
    const: weapon
  name:
    description: The display name of the weapon
    type: string
  quality:
    description: The quality tier of the weapon
    $ref: item-quality.schema.yaml
  level:
    description: The item's level
    type: integer
    minimum: 1
  required_level:
    description: The minimum level required to equip this weapon
    type: integer
    minimum: 1
  weapon_type:
    description: The type of weapon
    $ref: weapon-type.schema.yaml
  model:
    description: The item model used to render this weapon
    $ref: ../item-model-reference.schema.yaml
  attack_speed:
    description: Attack speed in attacks per second
    type: number
    exclusiveMinimum: 0.0
  damage:
    description: Damage dealt by this weapon
    $ref: weapon-damage.schema.yaml
  sockets:
    description: Number of socketable slots
    type: integer
    minimum: 0
    default: 0
  bonuses:
    description: Stat bonuses granted while this weapon is equipped
    $ref: bonuses.schema.yaml
  flavor_text:
    description: Lore text shown in the item tooltip
    type: string
  sell_price:
    description: Gold received when selling this weapon to a vendor
    type: integer
    minimum: 0
required:
  - type
  - name
  - quality
  - level
  - required_level
  - weapon_type
  - attack_speed
  - model
additionalProperties: false
