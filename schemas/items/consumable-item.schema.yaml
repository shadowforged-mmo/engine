$schema: https://json-schema.org/draft/2020-12/schema
$id: https://shadowforgedmmo.com/schemas/items/consumable-item.schema.yaml
title: Consumable Item
description: A consumable item
type: object
properties:
  type:
    type: string
    const: consumable
  name:
    description: The display name of the consumable
    type: string
  quality:
    description: The quality tier of the consumable
    $ref: item-quality.schema.yaml
  level:
    description: The item's level
    type: integer
    minimum: 1
  use:
    description: Tooltip text describing what the consumable does when used
    type: string
  sell_price:
    description: Gold received when selling this consumable to a vendor
    type: integer
    minimum: 0
  required_level:
    description: The minimum level required to use this consumable
    type: integer
    minimum: 1
  flavor_text:
    description: Lore text shown in the item tooltip
    type: string
required:
  - type
  - name
  - quality
  - level
  - use
  - required_level
additionalProperties: false
