$schema: https://json-schema.org/draft/2020-12/schema
$id: https://shadowforgedmmo.com/schemas/items/accessory.schema.yaml
title: Accessory
description: An accessory item (rings, wrist, trinket)
type: object
properties:
  type:
    type: string
    const: accessory
  name:
    description: The display name of the accessory
    type: string
  quality:
    description: The quality tier of the accessory
    $ref: item-quality.schema.yaml
  level:
    description: The item's level
    type: integer
    minimum: 1
  slot:
    description: The accessory slot this item occupies
    $ref: accessory-slot.schema.yaml
  sockets:
    description: Number of socketable slots
    type: integer
    minimum: 0
  bonuses:
    description: Stat bonuses granted while this accessory is equipped
    $ref: bonuses.schema.yaml
  required_level:
    description: The minimum level required to equip this accessory
    type: integer
    minimum: 1
  flavor_text:
    description: Lore text shown in the item tooltip
    type: string
  sell_price:
    description: Gold received when selling this accessory to a vendor
    type: integer
    minimum: 0
required:
  - type
  - name
  - quality
  - level
  - slot
  - sockets
  - required_level
additionalProperties: false
